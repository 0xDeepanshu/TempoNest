# Keep appId stable so NSIS upgrades the existing WorkZen/TempoNest install
# instead of creating a second application entry.
appId: app.temponest.desktop
productName: WorkZen
copyright: Copyright © 2026 WorkZen

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkZen
  # Local timer, queue, and credential data is stored outside the install
  # directory. Never remove it during an upgrade or uninstall.
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}
