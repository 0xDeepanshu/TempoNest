name: Release WorkZen Desktop

# Releases are published only for an intentional version tag, never for an
# ordinary push to main. Tag `v0.2.1` must match electron/package.json.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-workzen-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match electron/package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production assets and typecheck
        run: npm run build

      - name: Publish Windows installer, blockmap and latest.yml
        run: npx electron-builder --win --publish always
        env:
          # Built-in per-run token; it is used only to upload release assets and
          # is never bundled into the application.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing. Leave the secrets unset for an unsigned build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
