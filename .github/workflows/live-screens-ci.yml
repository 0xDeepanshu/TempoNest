name: Live screens CI

# Verification for the Flowtrium live-screen integration. It runs only on the feature branch, on pull
# requests that touch these areas, or by hand, and it deploys nothing.
#
# Every step copies its output to a log in $RUNNER_TEMP. When a job fails, the last step turns the
# interesting lines of those logs into one annotation per log, so the reason for a failure is visible on
# the run page and through the public check-run annotations without downloading raw job logs.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/flowtrium-live-screens
  pull_request:
    paths:
      - 'backend/**'
      - 'electron/**'
      - 'web/src/lib/types.ts'
      - '.github/workflows/live-screens-ci.yml'

permissions:
  contents: read

concurrency:
  group: live-screens-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANNOTATE_PATTERN: 'error TS|FAIL|AssertionError|Error:|ERROR|expected|Expected|Received|Cannot find|TypeError|ReferenceError|SyntaxError|✗|×|not ok|relation .* does not exist|violates|column .* does not exist|npm ERR!'

jobs:
  backend:
    name: Backend (typecheck, build, migration, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workzen
          POSTGRES_PASSWORD: workzen
          POSTGRES_DB: workzen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workzen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      PGPASSWORD: workzen
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: |
          exec > >(tee "$RUNNER_TEMP/backend-typecheck.log") 2>&1
          npm run typecheck
      - name: Build
        run: |
          exec > >(tee "$RUNNER_TEMP/backend-build.log") 2>&1
          npm run build

      - name: Migration - apply every migration to an empty database
        env:
          DATABASE_URL: postgresql://workzen:workzen@localhost:5432/workzen_migrate
        run: |
          exec > >(tee "$RUNNER_TEMP/backend-migrate.log") 2>&1
          psql -h localhost -U workzen -d workzen_test -c "CREATE DATABASE workzen_migrate"
          npx sequelize-cli db:migrate
          npx sequelize-cli db:migrate:status | tail -3

      - name: Migration - schema assertions (constraints, indexes, defaults, delete rules)
        run: |
          exec > >(tee "$RUNNER_TEMP/backend-schema.log") 2>&1
          Q() { psql -h localhost -U workzen -d workzen_migrate -At -v ON_ERROR_STOP=1 -c "$1"; }
          expect() { if [ "$1" != "$2" ]; then echo "FAIL: $3 (got '$1', want '$2')"; exit 1; fi; echo "ok: $3"; }
          expect "$(Q "select count(*) from pg_indexes where indexname in ('integration_viewer_links_active_external_unique','integration_viewer_links_active_workzen_unique') and indexdef like '%UNIQUE%' and indexdef like '%ACTIVE%'")" 2 "partial unique indexes on active links"
          expect "$(Q "select count(*) from pg_indexes where indexname = 'integration_viewer_link_requests_nonce_unique' and indexdef like '%UNIQUE%'")" 1 "nonce unique"
          expect "$(Q "select column_default from information_schema.columns where table_name='screen_live_sessions' and column_name='origin'")" "'WORKZEN'::character varying" "origin default"
          expect "$(Q "select is_nullable from information_schema.columns where table_name='screen_live_sessions' and column_name='origin'")" NO "origin not null"
          expect "$(Q "select count(*) from information_schema.columns where table_name='screen_live_sessions' and column_name in ('integration_connection_id','integration_viewer_link_id','external_organization_id','external_user_id','indicator_confirmed_at') and is_nullable='YES'")" 5 "new session columns nullable"
          expect "$(Q "select count(*) from pg_constraint where conname in ('screen_live_sessions_origin_check','integration_viewer_links_status_check','integration_viewer_link_requests_status_check') and convalidated")" 3 "check constraints validated"
          expect "$(Q "select string_agg(distinct confdeltype::text, ',' order by confdeltype::text) from pg_constraint c join pg_class t on t.oid=c.conrelid where contype='f' and t.relname='screen_live_sessions' and c.conname like '%integration%'")" "n" "session integration FKs are ON DELETE SET NULL"
          expect "$(Q "select count(*) from pg_constraint c join pg_class t on t.oid=c.conrelid where contype='f' and t.relname='integration_viewer_links' and confdeltype='c'")" 3 "link FKs cascade from connection, organization and user"

      - name: Migration - rollback removes only what it added, then re-applies
        env:
          DATABASE_URL: postgresql://workzen:workzen@localhost:5432/workzen_migrate
        run: |
          exec > >(tee "$RUNNER_TEMP/backend-rollback.log") 2>&1
          Q() { psql -h localhost -U workzen -d workzen_migrate -At -v ON_ERROR_STOP=1 -c "$1"; }
          before=$(Q "select count(*) from information_schema.columns where table_name='screen_live_sessions'")
          npx sequelize-cli db:migrate:undo
          after=$(Q "select count(*) from information_schema.columns where table_name='screen_live_sessions'")
          [ "$((before - after))" = "6" ] || { echo "FAIL: rollback removed $((before - after)) columns, expected 6"; exit 1; }
          [ "$(Q "select count(*) from information_schema.tables where table_name in ('integration_viewer_links','integration_viewer_link_requests')")" = "0" ] || { echo "FAIL: tables remain"; exit 1; }
          [ "$(Q "select count(*) from information_schema.columns where table_name='screen_live_sessions' and column_name in ('id','organization_id','employee_id','desktop_agent_id','time_session_id','started_by_user_id','status','started_at','expires_at','ended_at','termination_reason')")" = "11" ] || { echo "FAIL: original columns changed"; exit 1; }
          npx sequelize-cli db:migrate
          echo "rollback and re-apply ok"

      - name: Tests - new suites on PostgreSQL (serial)
        env:
          TEST_DATABASE_URL: postgresql://workzen:workzen@localhost:5432/workzen_test
        run: |
          exec > >(tee "$RUNNER_TEMP/backend-tests-focused.log") 2>&1
          # One file at a time: the suites share this single PostgreSQL database.
          npx vitest run --no-file-parallelism \
            tests/integrationViewerLinks.test.ts \
            tests/integrationLiveScreens.test.ts

      - name: Tests - full backend suite (the repository default, in-memory database)
        run: |
          exec > >(tee "$RUNNER_TEMP/backend-tests-full.log") 2>&1
          npm test

      - name: Annotate failures
        if: failure()
        working-directory: .
        run: |
          for f in "$RUNNER_TEMP"/*.log; do
            [ -f "$f" ] || continue
            body=$( (grep -E "$ANNOTATE_PATTERN" "$f" || true) | head -70 | cut -c1-400 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] && echo "::error title=$(basename "$f" .log)::$body"
          done
          exit 0

      - name: Report test counts
        if: always()
        working-directory: .
        run: |
          for f in "$RUNNER_TEMP"/*tests*.log; do
            [ -f "$f" ] || continue
            c=$( (sed 's/\x1b\[[0-9;]*m//g' "$f" | grep -E "^ *(Test Files|Tests) " || true) | sed 's/^ *//' | tr '\n' ';')
            echo "::notice title=counts $(basename "$f" .log)::$c"
          done

  electron:
    name: Desktop app (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: electron
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: |
          exec > >(tee "$RUNNER_TEMP/electron-typecheck.log") 2>&1
          npm run typecheck
      - name: Tests
        run: |
          exec > >(tee "$RUNNER_TEMP/electron-tests.log") 2>&1
          npm test
      - name: Annotate failures
        if: failure()
        working-directory: .
        run: |
          for f in "$RUNNER_TEMP"/*.log; do
            [ -f "$f" ] || continue
            body=$( (grep -E "$ANNOTATE_PATTERN" "$f" || true) | head -70 | cut -c1-400 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] && echo "::error title=$(basename "$f" .log)::$body"
          done
          exit 0

      - name: Report test counts
        if: always()
        working-directory: .
        run: |
          for f in "$RUNNER_TEMP"/*tests*.log; do
            [ -f "$f" ] || continue
            c=$( (sed 's/\x1b\[[0-9;]*m//g' "$f" | grep -E "^ *(Test Files|Tests) " || true) | sed 's/^ *//' | tr '\n' ';')
            echo "::notice title=counts $(basename "$f" .log)::$c"
          done

  web:
    name: Web (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: |
          exec > >(tee "$RUNNER_TEMP/web-typecheck.log") 2>&1
          # Next generates the route prop types (LayoutProps, PageProps) that the app uses.
          npx next typegen
          npm run typecheck
      - name: Annotate failures
        if: failure()
        working-directory: .
        run: |
          for f in "$RUNNER_TEMP"/*.log; do
            [ -f "$f" ] || continue
            body=$( (grep -E "$ANNOTATE_PATTERN" "$f" || true) | head -70 | cut -c1-400 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] && echo "::error title=$(basename "$f" .log)::$body"
          done
          exit 0

  screenlive-postgres-comparison:
    name: Existing screenLive suite on PostgreSQL (comparison)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Informational: it records whether the existing suite already fails on PostgreSQL on the original
    # main commit. It never gates the run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-main
            ref: 35c929840a2cd22877ac9309dde875a02e328705
          - label: this-branch
            ref: ${{ github.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workzen
          POSTGRES_PASSWORD: workzen
          POSTGRES_DB: workzen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workzen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://workzen:workzen@localhost:5432/workzen_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run tests/screenLive.test.ts on PostgreSQL
        run: |
          npx vitest run --no-file-parallelism tests/screenLive.test.ts 2>&1 | tee "$RUNNER_TEMP/screenlive.log" || true
      - name: Record the outcome
        if: always()
        working-directory: .
        run: |
          clean=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/screenlive.log")
          counts=$( (echo "$clean" | grep -E "^ *(Test Files|Tests) " || true) | sed 's/^ *//' | tr '\n' ';')
          fails=$( (echo "$clean" | grep -E "^ *FAIL " || true) | sed 's/^ *//' | sort -u | tr '\n' ';')
          echo "::notice title=screenLive on PostgreSQL ${{ matrix.label }}::${counts} FAILING: ${fails}"
